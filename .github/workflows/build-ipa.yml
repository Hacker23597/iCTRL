
name: Build iCTRL IPAs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(find /Applications \
            -maxdepth 1 -name 'Xcode*.app' \
            | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode installation not found"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build release IPAs
        run: make ipa UNSIGNED=1

      - name: Upload IPA files
        uses: actions/upload-artifact@v4
        with:
          name: iCTRL-IPAs
          path: release/*.ipa
          if-no-files-found: error
          retention-days: 7
