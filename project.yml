name: iCTRL
options:
  bundleIdPrefix: com.openminis
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: K8Q74NT2BG

targets:
  iCTRL:
    type: application
    platform: iOS
    sources:
      - path: iCTRLApp
      - path: iCTRLKit
      # Shared with the runner: one string table for both processes, so a phrase
      # the user sees in a notification matches the one in the app.
      - path: iCTRLUITests/Localized.swift

      # AltSign (MIT) and ldid (AGPL) — Apple ID auth, developer-portal
      # operations, and Mach-O code signing. Compiled from source rather than
      # linked as a package: upstream ships no Package.swift, only a podspec,
      # and the SideStore fork that does carries no license at all. The file
      # selection below mirrors that podspec's subspecs; see NOTICE.md.
      - path: Dependencies/AltSign/AltSign
        excludes:
          # AltSign's own framework Info.plist. Copied as a resource it lands
          # at the bundle root and overwrites the app's, stripping
          # CFBundleIdentifier and CFBundleExecutable — the bundle then builds
          # fine and is rejected at install as "not a valid bundle".
          - "Info.plist"
      # ldid.cpp is deliberately absent: AltSign's alt_ldid.cpp `#include`s it
      # textually, so compiling it as its own unit duplicates every ldid symbol.
      - path: Dependencies/AltSign/Dependencies/ldid/lookup2.c
      # libplist is likewise absent — the IDevice xcframework already links a
      # copy, and building a second one duplicates all 91 plist_* symbols.
      # ldid reaches the FFI's copy through the header search path below.
      - path: Dependencies/AltSign/Dependencies/minizip
        includes:
          - "*.c"
          - "*.h"
        excludes:
          # Windows I/O, and the two command-line drivers with their own main().
          - "iowin32.*"
          - "minizip.c"
          - "miniunz.c"
      - path: Dependencies/AltSign/Dependencies/corecrypto
        includes:
          - "*.h"
          - "*.m"
        excludes:
          - "ccperf.h"
    dependencies:
      # idevice (MIT) — the lockdown/RSD/image-mounter client that does the
      # actual DDI mount. Fetched by Scripts/fetch-idevice.sh rather than
      # committed: the upstream xcframework is a 215MB release asset and is not
      # in the repo tree, so SPM cannot resolve it by URL.
      - framework: Frameworks/IDevice.xcframework
        embed: false
      # OpenSSL, prebuilt for iOS and vendored by AltSign. Used for the CSR and
      # the PKCS#12 the certificate comes back in. Referenced by path (with
      # LIBRARY_SEARCH_PATHS below) rather than as an `sdk:` dependency, which
      # emits -lcrypto without telling the linker where to look.
      - framework: Dependencies/AltSign/Dependencies/OpenSSL/ios/lib/libcrypto.a
        embed: false
      - framework: Dependencies/AltSign/Dependencies/OpenSSL/ios/lib/libssl.a
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openminis.ictrl
        # AltSign is Objective-C/C++; the app is Swift.
        SWIFT_OBJC_BRIDGING_HEADER: iCTRLApp/iCTRL-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++11"
        HEADER_SEARCH_PATHS:
          - $(inherited)
          # Flat directory of symlinks that makes AltSign's own
          # `#import <AltSign/X.h>` resolve; built by the pre-build script
          # below, the same shape CocoaPods synthesizes.
          - $(SRCROOT)/build/altsign-headers
          - $(SRCROOT)/Dependencies/AltSign
          - $(SRCROOT)/Dependencies/AltSign/AltSign/ldid
          - $(SRCROOT)/Dependencies/AltSign/Dependencies
          - $(SRCROOT)/Dependencies/AltSign/Dependencies/ldid
          - $(SRCROOT)/Dependencies/AltSign/Dependencies/ldid/libplist/include
          - $(SRCROOT)/Dependencies/AltSign/Dependencies/ldid/libplist/src
          - $(SRCROOT)/Dependencies/AltSign/Dependencies/ldid/libplist/libcnary/include
          - $(SRCROOT)/Dependencies/AltSign/Dependencies/OpenSSL/ios/include
        # corecrypto's headers use transparent unions, which clang rejects under
        # the strictness this target otherwise builds with.
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Dependencies/AltSign/Dependencies/OpenSSL/ios/lib
        OTHER_CFLAGS:
          - $(inherited)
          - -DCORECRYPTO_DONOT_USE_TRANSPARENT_UNION=1
        # ldid predates several tightenings; these are its own warnings, not
        # ours, and failing the build on them would mean patching a vendored
        # dependency we deliberately track unmodified.
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "iCTRL needs local network access to serve the automation API."
        # LSApplicationQueriesSchemes can't be expressed as an INFOPLIST_KEY_
        # setting — Xcode only maps an allowlist of keys and drops this one
        # silently — so it lives in a real plist that gets merged in. Without it
        # iOS denies UIApplication.open() for these schemes with no error, which
        # would break the Start button and the StikDebug shortcut.
        INFOPLIST_FILE: iCTRLApp/Info.plist
    preBuildScripts:
      # AltSign's headers `#import <AltSign/X.h>` while the files themselves sit
      # in subdirectories; this builds the flat directory that makes those
      # resolve. Runs every build so it can't go stale against the submodule.
      - name: "Link AltSign headers"
        script: '"$SRCROOT/Scripts/link-altsign-headers.sh"'
        basedOnDependencyAnalysis: false

  iCTRLUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iCTRLUITests
      - path: iCTRLKit
      # The operating manual, bundled so GET /skill can serve it at runtime.
      - path: SKILL.md
        buildPhase: resources
      # The reference client, served at GET /skill/examples/python so a caller
      # can download a working v1-envelope implementation straight off the
      # device instead of writing the crypto itself.
      - path: Scripts/ictrl_rpc.py
        buildPhase: resources
      # Static aarch64-musl CLI, served at GET /skill/examples/cli. Built for
      # the Minis sandbox (Alpine arm64), whose minirootfs has no python3 — the
      # reference client there would cost an `apk add` before the first call.
      - path: cli/ictrl
        buildPhase: resources
      - path: cli/ictrl.sh
        buildPhase: resources
    dependencies:
      - target: iCTRL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openminis.ictrl.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: iCTRLUITests/XCTestPrivate-Bridging-Header.h
        # The server runs in THIS (runner) process, so the runner is the app that
        # needs Local Network access. Declared here so the permission prompt has a
        # rationale (raised via a LAN touch only when on Wi-Fi and remote is
        # unreachable — skipped on cellular).
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "iCTRL needs local network access to serve the automation API on your LAN."
        TEST_HOST: ""
    postBuildScripts:
      - name: "Strip unnecessary XCTest frameworks"
        script: |
          RUNNER_APP="${BUILT_PRODUCTS_DIR}/iCTRLUITests-Runner.app"
          echo "🔧 Stripping XCTest frameworks from Runner.app..."
          rm -rf "${RUNNER_APP}/Frameworks/XCTAutomationSupport.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCTest.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCTestCore.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCTestSupport.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCUIAutomation.framework"
          rm -rf "${RUNNER_APP}/Frameworks/XCUnit.framework"
          rm -rf "${RUNNER_APP}/Frameworks/Testing.framework"
          rm -f  "${RUNNER_APP}/Frameworks/libXCTestSwiftSupport.dylib"
          rmdir  "${RUNNER_APP}/Frameworks" 2>/dev/null || true
          echo "✅ Frameworks stripped"

schemes:
  iCTRL:
    build:
      targets:
        iCTRL: all
        iCTRLUITests: [test]
    test:
      targets:
        - iCTRLUITests
      testPlans: []
